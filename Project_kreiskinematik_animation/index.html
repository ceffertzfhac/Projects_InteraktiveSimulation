<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kreiskinematik und Vektorrechnung – FH Aachen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false },
  startup: { typeset: false }      // Setzen erst nach Schrift-Laden und Layout (js/ui.js)
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<!-- GSAP (Animations-Engine, kostenlos, Standard-Lizenz) — klassisch, VOR den Modulen -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../shared/css/design-system.css">
<link rel="stylesheet" href="../shared/css/step-animation.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="light step-anim">

<header class="topbar">
  <div class="topbar-left">
    <a href="../AllAnimations/index.html" class="back-btn">← Übersicht</a>
  </div>
  <div class="topbar-title">
    <div class="topbar-title-text">
      <div class="topbar-title-line">
        Kreiskinematik und Vektorrechnung
        <span class="version">v0.1.1</span>
        <span class="inst">FH Aachen – FB 8 – Physik</span>
      </div>
      <div class="copyright">© 2026 FH Aachen, FB 8 · Alle Rechte vorbehalten</div>
    </div>
    <img src="../shared/img/logo_physik_mint.png" class="topbar-logo"
         alt="Lehr- und Forschungsgebiet Physik, FH Aachen FB 8"
         title="Lehr- und Forschungsgebiet Physik – FB 8">
  </div>
  <div class="topbar-right">
    <button class="print-btn" id="print_btn" popovertarget="print_pop" title="Drucken / PDF: Endzustand jedes Schritts"
            aria-label="Drucken oder als PDF sichern"></button>
    <div id="print_pop" class="print-pop" popover>
      <h4>Drucken / PDF</h4>
      Je Schritt eine Seite mit dem Endzustand.
      <button data-print="chapter">Aktuelles Kapitel</button>
      <button data-print="all">Alle Kapitel</button>
      <p>Im Druckdialog „Als PDF sichern“ wählen.</p>
    </div>
    <div class="theme-toggle-wrap">
      <span style="font-size:.82rem">🌙</span>
      <button class="theme-toggle" id="theme_toggle" title="Dark/Light Mode"></button>
      <span style="font-size:.82rem">☀️</span>
    </div>
  </div>
</header>

<div class="stage-wrap">
  <div class="stage">
    <!-- Linke ⅔: 3D-Bühne (Three.js, js/render.js), rechte ⅓: Formelspalte -->
    <div class="stage-3d" id="stage_3d"></div>
    <svg id="stage_svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet"
         aria-label="Animationsbühne"></svg>
    <div class="col-bg"></div>

    <!-- Formelspalte: statisches HTML, MathJax setzt einmal beim Laden.
         Sichtbarkeit steuert ausschließlich die Timeline (steps.js). -->
    <div class="slide-layer">
      <div class="slide-card pos-col" data-card="k1_title">
        <div class="kicker">Kapitel 1</div>
        <h3>Normalform der Ebene</h3>
      </div>
    </div>
  </div>
</div>

<footer class="transport" id="transport"></footer>

<script type="module" src="js/ui.js"></script>
</body>
</html>
